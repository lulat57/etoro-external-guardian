name: Deploy Close Intent Fix Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-close-intent-once.yml

permissions:
  contents: read

concurrency:
  group: etoro-close-intent-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      GH_TOKEN: ${{ secrets.ETORO_GUARDIAN_TOKEN }}
      CODESPACE: psychic-couscous-wvvq65qjw4jx2v54p
      REPO_DIR: /workspaces/codespaces-blank
      PROJECT_DIR: /workspaces/codespaces-blank/agent_demo
      EXPECTED_SHA: ad5b02fc8c7944077b95426c15c0283236d182bd

    steps:
      - name: Verify secret and Codespace
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"

          STATE=$(gh api "/user/codespaces/$CODESPACE" --jq '.state')
          if [ "$STATE" != "Available" ]; then
            gh api --method POST "/user/codespaces/$CODESPACE/start" >/dev/null
          fi

          for i in {1..24}; do
            STATE=$(gh api "/user/codespaces/$CODESPACE" --jq '.state')
            echo "Codespace state: $STATE"
            [ "$STATE" = "Available" ] && break
            sleep 5
          done
          [ "$STATE" = "Available" ]

          for i in {1..10}; do
            echo "SSH readiness $i/10"
            if timeout --signal=TERM --kill-after=3s 30s \
              gh codespace ssh -c "$CODESPACE" -- \
              -T -o ConnectTimeout=12 -o ConnectionAttempts=1 true; then
              exit 0
            fi
            sleep 8
          done
          exit 3

      - name: Fast-forward exact reviewed commit
        shell: bash
        run: |
          set -euo pipefail

          ssh_run() {
            local remote_cmd="$1"
            timeout --signal=TERM --kill-after=3s 60s \
              gh codespace ssh -c "$CODESPACE" -- \
              -T \
              -o ConnectTimeout=12 \
              -o ConnectionAttempts=1 \
              -o ServerAliveInterval=5 \
              -o ServerAliveCountMax=2 \
              "bash -lc '$remote_cmd'"
          }

          ssh_run "cd $REPO_DIR && test -z \"\$(git status --porcelain --untracked-files=no)\" && git fetch origin main && test \"\$(git rev-parse origin/main)\" = $EXPECTED_SHA && git merge-base --is-ancestor HEAD $EXPECTED_SHA && git merge --ff-only $EXPECTED_SHA && python3 -m py_compile agent_demo/trading.py agent_demo/control.py agent_demo/guardian.py && grep -q 'def persist_close_intent' agent_demo/trading.py"

      - name: Restart and verify DEMO stack
        shell: bash
        run: |
          set -euo pipefail

          ssh_run() {
            local remote_cmd="$1"
            timeout --signal=TERM --kill-after=3s 60s \
              gh codespace ssh -c "$CODESPACE" -- \
              -T \
              -o ConnectTimeout=12 \
              -o ConnectionAttempts=1 \
              -o ServerAliveInterval=5 \
              -o ServerAliveCountMax=2 \
              "bash -lc '$remote_cmd'"
          }

          ssh_run "cd $PROJECT_DIR && python3 control.py repair"
          sleep 15

          STATUS="$RUNNER_TEMP/status.json"
          ssh_run "cd $PROJECT_DIR && python3 control.py status" > "$STATUS"
          jq -e '
            .safety_ok == true and
            .control_state.active_engine == "trading.py" and
            .guardian.desired.environment == "DEMO" and
            .guardian.desired.real_trading_enabled == false and
            (.guardian.processes.supervisor | length > 0) and
            (.guardian.processes.worker | length > 0) and
            (.guardian.processes.radar | length > 0) and
            (.guardian.processes.reporter | length > 0) and
            (.guardian.processes.drive_sync | length > 0)
          ' "$STATUS" >/dev/null
          echo "CLOSE INTENT FIX DEPLOYED AND VERIFIED"
