name: External Guardian Auto Recovery

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"

permissions:
  contents: read

concurrency:
  group: etoro-external-guardian
  cancel-in-progress: false

jobs:
  guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      GH_TOKEN: ${{ secrets.ETORO_GUARDIAN_TOKEN }}
      CODESPACE: psychic-couscous-wvvq65qjw4jx2v54p
      PROJECT_DIR: /workspaces/codespaces-blank/agent_demo

    steps:
      - name: Verify secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "ETORO_GUARDIAN_TOKEN is not configured."
            exit 1
          fi

      - name: Check and start Codespace
        shell: bash
        run: |
          set -euo pipefail

          STATE=$(gh api "/user/codespaces/$CODESPACE" --jq '.state')
          echo "Initial state: $STATE"

          if [ "$STATE" != "Available" ]; then
            gh api --method POST "/user/codespaces/$CODESPACE/start" >/dev/null
          fi

          for i in {1..12}; do
            STATE=$(gh api "/user/codespaces/$CODESPACE" --jq '.state')
            echo "Codespace state: $STATE"

            if [ "$STATE" = "Available" ]; then
              sleep 10
              exit 0
            fi

            sleep 5
          done

          echo "Codespace did not become Available in time."
          exit 2

      - name: Recover and verify V3
        shell: bash
        run: |
          set -euo pipefail

          ssh_run() {
            local remote_cmd="$1"
            local attempts="${2:-2}"
            local n

            for n in $(seq 1 "$attempts"); do
              echo "SSH attempt $n/$attempts" >&2

              if timeout --signal=TERM --kill-after=3s 25s \
                gh codespace ssh -c "$CODESPACE" -- \
                -T \
                -o ConnectTimeout=8 \
                -o ConnectionAttempts=1 \
                -o ServerAliveInterval=5 \
                -o ServerAliveCountMax=2 \
                "bash -lic 'cd \"$PROJECT_DIR\" && ($remote_cmd || true)'"; then
                return 0
              fi

              echo "SSH transport attempt $n failed or timed out." >&2
              sleep 6
            done

            return 1
          }

          STATUS="$RUNNER_TEMP/status.json"

          if ssh_run "python3 control.py status" 2 > "$STATUS" && jq -e . "$STATUS" >/dev/null 2>&1; then
            jq -e '
              .safety_ok == true and
              .guardian.desired.environment == "DEMO" and
              .guardian.desired.real_trading_enabled == false
            ' "$STATUS" >/dev/null

            NEED_REPAIR=$(jq -r '
              (
                (.guardian.processes.supervisor | length == 0) or
                (.guardian.processes.worker | length == 0) or
                (.guardian.processes.radar | length == 0) or
                (.guardian.processes.reporter | length == 0) or
                (.guardian.processes.drive_sync | length == 0)
              )
            ' "$STATUS")

            echo "Repair needed: $NEED_REPAIR"
          else
            NEED_REPAIR=true
            echo "Status unavailable or invalid; repair will be attempted."
          fi

          if [ "$NEED_REPAIR" = "true" ]; then
            echo "Launching control.py repair."
            ssh_run "python3 control.py repair" 2 || {
              echo "Could not reach Codespace for repair."
              exit 4
            }
          fi

          echo "Waiting for internal supervisor to complete recovery."
          sleep 15

          for i in {1..12}; do
            FINAL="$RUNNER_TEMP/status-final-$i.json"
            echo "Verification $i/12"

            if ssh_run "python3 control.py status" 1 > "$FINAL" && \
               jq -e . "$FINAL" >/dev/null 2>&1 && \
               jq -e '
                 .safety_ok == true and
                 .control_state.active_engine == "trading.py" and
                 .guardian.desired.environment == "DEMO" and
                 .guardian.desired.real_trading_enabled == false and
                 (.guardian.processes.supervisor | length > 0) and
                 (.guardian.processes.worker | length > 0) and
                 (.guardian.processes.radar | length > 0) and
                 (.guardian.processes.reporter | length > 0) and
                 (.guardian.processes.drive_sync | length > 0)
               ' "$FINAL" >/dev/null; then
              echo "EXTERNAL GUARDIAN AUTO RECOVERY OK"
              exit 0
            fi

            echo "Recovery not complete yet."
            sleep 10
          done

          echo "Recovery incomplete after wait window."
          exit 5
