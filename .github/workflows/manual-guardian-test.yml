name: External Guardian Manual Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_TOKEN: ${{ secrets.ETORO_GUARDIAN_TOKEN }}
      CODESPACE: psychic-couscous-wvvq65qjw4jx2v54p
      PROJECT_DIR: /workspaces/codespaces-blank/agent_demo

    steps:
      - name: Verify secret
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ETORO_GUARDIAN_TOKEN is not configured."
            exit 1
          fi

      - name: Check initial Codespace state
        id: initial
        shell: bash
        run: |
          set -euo pipefail
          STATE=$(gh api "/user/codespaces/$CODESPACE" --jq '.state')
          echo "Initial Codespace state: $STATE"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"

      - name: Start Codespace if needed
        if: steps.initial.outputs.state != 'Available'
        shell: bash
        run: |
          set -euo pipefail
          echo "Codespace is not Available. Sending start request."
          gh api --method POST "/user/codespaces/$CODESPACE/start" >/dev/null
          echo "Start request sent."

      - name: Wait until Codespace is Available
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..36}; do
            STATE=$(gh api "/user/codespaces/$CODESPACE" --jq '.state')
            echo "Codespace state: $STATE"
            if [ "$STATE" = "Available" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Codespace did not become Available within 6 minutes."
          exit 3

      - name: Read project status
        shell: bash
        run: |
          set -euo pipefail
          gh codespace ssh -c "$CODESPACE" -- "cd '$PROJECT_DIR' && python3 control.py status"

      - name: Test completed
        if: success()
        shell: bash
        run: |
          echo "MANUAL GUARDIAN START+STATUS TEST OK"
          echo "No repair - no trading changes - no schedule."
